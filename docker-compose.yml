# Triggarr Docker Compose
# To build locally instead of pulling the image, replace the `image:` line
# with `build: .` and run `docker compose up --build`.

services:
  triggarr:
    image: ghcr.io/thejuran/triggarr:latest
    container_name: triggarr
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - triggarr_config:/config
    ports:
      - "127.0.0.1:8484:8484"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    # RES-01: must exceed TRIGGARR_SHUTDOWN_DRAIN_TIMEOUT (default 60s) so
    # Docker waits for the in-process search-cycle drain before SIGKILL.
    # 90s = 60s drain + 30s margin for client/db close steps.
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  triggarr_config:
