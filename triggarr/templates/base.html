<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Triggarr{% endblock %}</title>
  <link rel="icon" type="image/x-icon" href="{{ request.url_for('static', path='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ request.url_for('static', path='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ request.url_for('static', path='favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ request.url_for('static', path='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ request.url_for('static', path='site.webmanifest') }}">
  <link rel="stylesheet" href="{{ request.url_for('static', path='css/output.css') }}">
  <script src="{{ request.url_for('static', path='js/htmx.min.js') }}"></script>
</head>
<body class="bg-triggarr-bg text-triggarr-text min-h-screen">
  <nav class="bg-triggarr-card border-b border-triggarr-border">
    <div class="max-w-5xl mx-auto px-6 py-3 flex items-center justify-between">
      <span class="text-triggarr-green font-bold text-xl">Triggarr</span>
      <span class="text-xs text-triggarr-muted ml-2">v{{ triggarr_version }}</span>
      <div class="flex items-center gap-6">
        <a href="{{ request.url_for('dashboard') }}"
           class="{% block nav_dashboard_class %}text-white{% endblock %} hover:text-white text-sm">
          Dashboard
        </a>
        <a href="{{ request.url_for('history_page') }}"
           class="{% block nav_history_class %}text-triggarr-muted{% endblock %} hover:text-white text-sm">
          History
        </a>
        <a href="{{ request.url_for('settings_page') }}"
           class="{% block nav_settings_class %}text-triggarr-muted{% endblock %} hover:text-white text-sm">
          Settings
        </a>
      </div>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto px-6 py-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
