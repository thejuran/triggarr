<div id="search-log"
     hx-get="{{ request.url_for('partial_search_log') }}"
     hx-trigger="every 5s"
     hx-swap="outerHTML"
     class="bg-triggarr-card rounded-lg border border-triggarr-border p-5">
  <h2 class="text-lg font-semibold mb-4">Search Log</h2>
  {% set entries = search_log[:20] %}
  {% if not entries %}
  <p class="text-triggarr-muted text-sm">No searches yet.</p>
  {% else %}
  <div class="space-y-0">
    {% for entry in entries %}
    <div class="flex items-center gap-3 py-1.5 {% if not loop.last %}border-b border-triggarr-border/50{% endif %}">
        <span class="text-xs font-medium px-2 py-0.5 rounded
               {% if entry.app == 'Radarr' %}bg-orange-500/20 text-orange-400
               {% else %}bg-blue-500/20 text-blue-400{% endif %}">
            {{ entry.app }}
        </span>
        <span class="text-sm flex-1 truncate" {% if entry.detail %}title="{{ entry.detail }}"{% endif %}>{{ entry.name }}</span>
        <span class="text-xs text-triggarr-muted">{{ entry.queue_type }}</span>
        <span class="text-xs px-1.5 py-0.5 rounded
               {% if entry.outcome == 'grabbed' %}bg-green-500/20 text-green-400
               {% elif entry.outcome == 'partial' %}bg-amber-500/20 text-amber-400
               {% elif entry.outcome == 'unresolved' %}bg-gray-500/20 text-gray-400
               {% elif entry.outcome == 'failed' %}bg-red-500/20 text-red-400
               {% else %}bg-blue-500/20 text-blue-400{% endif %}"
               {% if entry.outcome == 'grabbed' %}title="Download detected within tracking window"
               {% elif entry.outcome == 'partial' %}title="Some episodes grabbed, not all"
               {% elif entry.outcome == 'unresolved' %}title="No grabs detected before window expired"
               {% endif %}>
            {{ entry.outcome or 'searched' }}
        </span>
        <span class="text-xs text-triggarr-muted">{{ entry.timestamp[:19] | replace('T', ' ') }}</span>
    </div>
    {% endfor %}
  </div>
  {% endif %}
</div>
