<div id="password-form">
  {% if success %}
  <div class="bg-green-900/50 border border-green-700 text-green-300 px-4 py-3 rounded mb-4">
    {{ success }}
  </div>
  {% endif %}
  {% if errors %}
  {% for field, msg in errors.items() %}
  <div class="bg-red-900/50 border border-red-700 text-red-300 px-4 py-3 rounded mb-4">
    {{ msg }}
  </div>
  {% endfor %}
  {% endif %}
  <form hx-post="/settings/password" hx-target="#password-form" hx-swap="outerHTML">
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-1">Current Password</label>
        <input type="password" name="current_password" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100">
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-1">New Password</label>
        <input type="password" name="new_password" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100">
      </div>
      <div>
        <label class="block text-sm font-medium text-zinc-300 mb-1">Confirm New Password</label>
        <input type="password" name="confirm_password" class="w-full bg-zinc-800 border border-zinc-700 rounded px-3 py-2 text-zinc-100">
      </div>
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
        Update Password
      </button>
    </div>
  </form>
</div>
