<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cleaned video search favicon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243553"/>
      <stop offset="100%" stop-color="#0F1A30"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1EDC7A"/>
      <stop offset="100%" stop-color="#14C86C"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="238" cy="256" r="103"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="64" fill="url(#bg)"/>

  <!-- magnifying glass white outline -->
  <circle cx="238" cy="256" r="146" fill="none" stroke="#FFFFFF" stroke-width="26"/>
  <line x1="318" y1="336" x2="390" y2="408" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round"/>

  <!-- magnifying glass green body -->
  <circle cx="238" cy="256" r="146" fill="none" stroke="url(#green)" stroke-width="20"/>
  <line x1="321" y1="339" x2="387" y2="405" stroke="url(#green)" stroke-width="28" stroke-linecap="round"/>

  <!-- lens fill -->
  <circle cx="238" cy="256" r="103" fill="#1E2C48"/>

  <!-- film strip -->
  <g clip-path="url(#lensClip)">
    <path d="M227 122
             C191 164 161 214 147 274
             C138 314 142 353 161 387
             C186 405 221 417 255 417
             C247 375 247 333 256 291
             C268 236 295 181 335 127
             C309 113 280 106 248 106
             C240 106 233 112 227 122 Z"
          fill="url(#green)"/>

    <!-- left sprocket holes -->
    <g fill="#1E2C48" transform="rotate(-29 206 255)">
      <rect x="167" y="144" width="18" height="10" rx="3"/>
      <rect x="159" y="170" width="18" height="10" rx="3"/>
      <rect x="151" y="196" width="18" height="10" rx="3"/>
      <rect x="145" y="222" width="18" height="10" rx="3"/>
      <rect x="139" y="248" width="18" height="10" rx="3"/>
      <rect x="135" y="274" width="18" height="10" rx="3"/>
      <rect x="133" y="300" width="18" height="10" rx="3"/>
      <rect x="133" y="326" width="18" height="10" rx="3"/>
    </g>

    <!-- right sprocket holes -->
    <g fill="#1E2C48" transform="rotate(30 287 248)">
      <rect x="287" y="127" width="18" height="10" rx="3"/>
      <rect x="292" y="152" width="18" height="10" rx="3"/>
      <rect x="297" y="177" width="18" height="10" rx="3"/>
      <rect x="301" y="202" width="18" height="10" rx="3"/>
      <rect x="305" y="227" width="18" height="10" rx="3"/>
      <rect x="308" y="252" width="18" height="10" rx="3"/>
      <rect x="310" y="277" width="18" height="10" rx="3"/>
      <rect x="312" y="302" width="18" height="10" rx="3"/>
    </g>

    <!-- film frame bars -->
    <rect x="180" y="201" width="73" height="10" rx="4" fill="#1E2C48" transform="rotate(26 216.5 206)"/>
    <rect x="155" y="287" width="62" height="10" rx="4" fill="#1E2C48" transform="rotate(20 186 292)"/>
  </g>
</svg>
