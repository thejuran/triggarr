name: Bug Report
description: Report a bug in Triggarr
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: version
    attributes:
      label: Triggarr Version
      options:
        - v2.8.1
        - v2.8
        - v2.7
        - v2.6
        - v2.5
        - v2.4
        - Older
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker Compose
        - Docker run
        - Bare metal
    validations:
      required: true
  - type: dropdown
    id: app-type
    attributes:
      label: App Type
      options:
        - Radarr
        - Sonarr
        - Lidarr
        - All
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any relevant log output
      render: text
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: Config Excerpt
      description: "Paste relevant config sections. **Remove API keys before pasting.**"
      render: toml
    validations:
      required: false
