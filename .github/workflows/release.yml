name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

jobs:
  release:
    # Run on tag push always, or on main only after CI succeeds
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/thejuran/triggarr
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/triggarr', vars.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=main
            type=raw,value=dev,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Python package
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          pip install --no-cache-dir build
          python -m build

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" &>/dev/null; then
            echo "Release $TAG_NAME already exists — uploading artifacts only"
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" \
              --title "Triggarr $TAG_NAME" \
              --generate-notes \
              --latest \
              dist/*
          fi
