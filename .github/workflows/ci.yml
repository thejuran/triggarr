name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Test CI policy scripts and plugin hooks
        run: |
          node -e "
            const major = Number(process.versions.node.split('.')[0]);
            console.log('Node ' + process.versions.node);
            if (major < 20) {
              console.error('Node >= 20 required for node:test and --import');
              process.exit(1);
            }
          "
          node --test .github/scripts/*.test.cjs .claude/plugins/planchk-router/test/planchk-router.test.mjs

      - name: Compile
        run: uv run --no-sync python -m compileall -q triggarr

      - name: Run tests with branch coverage
        id: pytest
        run: |
          set +e
          start_seconds=$(date +%s)
          uv run --no-sync pytest tests/ -q --junitxml=test-results.xml --cov=triggarr --cov-branch --cov-report=xml:coverage.xml
          status=$?
          end_seconds=$(date +%s)
          set -e
          echo "test_exit=$status" >> "$GITHUB_OUTPUT"
          echo "test_seconds=$((end_seconds - start_seconds))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14

      - name: Write coverage provenance
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_EXIT: ${{ steps.pytest.outputs.test_exit }}
          TEST_SECONDS: ${{ steps.pytest.outputs.test_seconds }}
        run: |
          node .github/scripts/coverage-provenance.cjs write --coverage coverage.xml --test-exit "$TEST_EXIT" --test-seconds "$TEST_SECONDS" --out coverage-provenance.json

      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            coverage-provenance.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail if tests failed
        env:
          TEST_EXIT: ${{ steps.pytest.outputs.test_exit }}
        run: |
          if [ "$TEST_EXIT" != "0" ]; then
            echo "pytest failed (exit $TEST_EXIT); coverage collection did not change this result" >&2
            exit 1
          fi

  lint:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run ruff
        run: uv run --no-sync ruff check triggarr/ tests/

  docker:
    needs: [test, lint]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Read package version for image provenance
        id: image-meta
        run: |
          python3 - <<'PYTHON'
          import os, re, tomllib
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          if not re.fullmatch(r'[A-Za-z0-9.!+_-]+', version):
              raise SystemExit('Invalid image version label')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PYTHON

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: triggarr:ci-test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image-meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit actual image dependencies
        run: |
          docker run --rm --entrypoint python triggarr:ci-test -m pip freeze --all --exclude triggarr > image-requirements.txt
          test -s image-requirements.txt
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Check image dependencies match uv.lock
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file requirements-locked.txt
          docker run --rm -v "$PWD/.github/scripts:/check:ro" --entrypoint python triggarr:ci-test /check/image_lock_consistency.py --dump-environment > image-environment.json
          uv run --no-project --with packaging==26.0 python .github/scripts/image_lock_consistency.py --locked requirements-locked.txt --freeze image-requirements.txt --environment image-environment.json
      - name: Check image dependency vulnerabilities
        run: uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip -r image-requirements.txt

      - name: Save the audited image
        run: |
          docker image inspect triggarr:ci-test --format '{{.Id}}' > image-id.txt
          docker save triggarr:ci-test -o image.tar
          sha256sum image.tar > image.tar.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: audited-image
          path: |
            image.tar
            image.tar.sha256
            image-id.txt
            image-requirements.txt
          if-no-files-found: error
          retention-days: 30

      - name: Download the published CI artifact for round-trip verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audited-image
          path: restored-image
      - name: Verify release image round trip
        working-directory: restored-image
        run: |
          sha256sum -c image.tar.sha256
          docker image rm triggarr:ci-test
          docker load -i image.tar
          test "$(docker image inspect triggarr:ci-test --format '{{.Id}}')" = "$(cat image-id.txt)"
          docker run --rm --entrypoint python triggarr:ci-test -m pip freeze --all --exclude triggarr > restored-requirements.txt
          diff -u image-requirements.txt restored-requirements.txt

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Export locked production dependencies
        run: uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file requirements-audit.txt
      - name: Audit dependencies (scanner errors also fail)
        run: uvx --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip -r requirements-audit.txt

  image-smoke:
    needs: [docker]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audited-image
          path: image

      - name: Verify and load audited image
        working-directory: image
        run: |
          sha256sum -c image.tar.sha256
          docker load -i image.tar
          test "$(docker image inspect triggarr:ci-test --format '{{.Id}}')" = "$(cat image-id.txt)"

      - name: Run shipped-image smoke test
        run: uv run --no-sync python -m tests.harness.image_smoke run --image triggarr:ci-test --expected-image-id-file image/image-id.txt

      - name: Rehearse release identity against audited image
        run: |
          test "$(docker image inspect triggarr:ci-test --format '{{.Id}}')" = "$(cat image/image-id.txt)"
          IMAGE_ID="$(cat image/image-id.txt)"
          export IMAGE_ID
          IMAGE_VERSION="$(docker image inspect triggarr:ci-test --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          export IMAGE_VERSION
          REHEARSAL_SHA="$(git rev-parse HEAD)"
          export REHEARSAL_SHA
          node .github/scripts/release-identity-rehearsal.cjs

  browser-e2e:
    needs: [docker]
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Install Chromium for Playwright
        run: uv run --no-sync playwright install --with-deps chromium

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audited-image
          path: image

      - name: Verify and load audited image
        working-directory: image
        run: |
          sha256sum -c image.tar.sha256
          docker load -i image.tar
          test "$(docker image inspect triggarr:ci-test --format '{{.Id}}')" = "$(cat image-id.txt)"

      - name: Run browser regression suite
        env:
          TRIGGARR_E2E_IMAGE: triggarr:ci-test
        run: |
          EXPECTED_IMAGE_ID="$(cat image/image-id.txt)"
          export EXPECTED_IMAGE_ID
          set +e
          uv run --no-sync pytest tests/e2e -q -p no:cacheprovider -m credential_pages --browser chromium --tracing off --screenshot off --video off --output e2e-artifacts/credential --junitxml e2e-credential.xml
          credential_status=$?
          uv run --no-sync pytest tests/e2e -q -p no:cacheprovider -m "not credential_pages" --browser chromium --tracing retain-on-failure --screenshot only-on-failure --output e2e-artifacts/pages --junitxml e2e-pages.xml
          pages_status=$?
          set -e
          if [ "$credential_status" -ne 0 ] || [ "$pages_status" -ne 0 ]; then
            echo "Browser regression suite failed: credential_pages exit=$credential_status, pages exit=$pages_status" >&2
            exit 1
          fi

      - name: Require a complete browser-suite result
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          def load(path):
              root = ET.parse(path).getroot()
              suite = root.find("testsuite") if root.tag == "testsuites" else root
              return {
                  "tests": int(suite.get("tests", 0)),
                  "skipped": int(suite.get("skipped", 0)),
                  "failures": int(suite.get("failures", 0)),
                  "errors": int(suite.get("errors", 0)),
              }

          checks = [("e2e-credential.xml", 6), ("e2e-pages.xml", 1)]
          bad = []
          for path, minimum in checks:
              try:
                  result = load(path)
              except Exception as exc:
                  bad.append(f"{path}: could not be parsed ({exc})")
                  continue
              if result["tests"] < minimum:
                  bad.append(f"{path}: expected at least {minimum} tests, saw {result['tests']}")
              if result["skipped"] != 0:
                  bad.append(f"{path}: expected 0 skipped, saw {result['skipped']}")
              if result["failures"] != 0:
                  bad.append(f"{path}: expected 0 failures, saw {result['failures']}")
              if result["errors"] != 0:
                  bad.append(f"{path}: expected 0 errors, saw {result['errors']}")
          if bad:
              sys.exit("Browser suite result incomplete: " + "; ".join(bad))
          print("Browser suite result complete: credential and pages junit files both report success with no skips")
          PY

      - name: Upload browser failure evidence
        if: >-
          failure() &&
          hashFiles('e2e-artifacts/credential/scan-complete.json') != '' &&
          hashFiles('e2e-artifacts/pages/scan-complete.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-e2e-failure
          path: e2e-artifacts
          retention-days: 14
          if-no-files-found: warn

  # Policy: docs/os-scan-policy.md. Never replace with aquasecurity/trivy-action or
  # setup-trivy (compromised March 2026, CVE-2026-33634).
  os-scan:
    needs: [docker]
    timeout-minutes: 15
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: audited-image
          path: image

      - name: Verify audited image checksum
        working-directory: image
        run: sha256sum -c image.tar.sha256

      - name: Install Trivy (pinned binary, checksum-verified)
        run: |
          curl -fsSLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | sha256sum -c -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          ./trivy --version

      - name: Scan OS packages (scanner errors fail the job)
        run: ./trivy image --input image/image.tar --scanners vuln --pkg-types os --format json --output trivy-results.json

      - name: Apply OS-scan policy
        run: |
          node .github/scripts/os-scan-gate.cjs --report trivy-results.json --exceptions .github/os-scan-exceptions.json --summary "$GITHUB_STEP_SUMMARY" --trivy-version "$TRIVY_VERSION"

  ci-ready:
    name: CI ready
    if: always()
    needs: [test, lint, docker, secrets, dependencies, image-smoke, browser-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          required = {"test", "lint", "docker", "secrets", "dependencies", "image-smoke", "browser-e2e"}
          results = json.loads(os.environ["RESULTS"])
          if set(results) != required:
              sys.exit("Missing or unexpected mandatory CI jobs")
          bad = {name: job.get("result") for name, job in results.items() if job.get("result") != "success"}
          if bad:
              sys.exit(f"Mandatory jobs did not succeed: {bad}")
          print("All mandatory CI jobs succeeded. This does not attest to Greptile review or product acceptance.")
          PY
